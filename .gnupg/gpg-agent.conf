# GPG Agent Configuration
# Cache settings
default-cache-ttl 600
max-cache-ttl 7200

# Pinentry program
# Wrapper dispatches to pinentry-curses (interactive `pass` shell wrapper
# sets PINENTRY_USER_DATA=curses) or pinentry-mac (default, e.g. passff)
pinentry-program /Users/ada/.gnupg/pinentry-wrapper.sh

# Enable SSH support
enable-ssh-support
